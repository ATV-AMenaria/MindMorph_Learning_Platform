# Local Postgres for MindMorph persistence (P1 #6).
#   docker compose up -d db
# Matches the default DATABASE_URL in config.py:
#   postgresql+psycopg://mindmorph:mindmorph@localhost:5432/mindmorph
services:
  db:
    # pgvector/pgvector ships Postgres 16 + the `vector` extension (P2 #9 RAG persistence).
    image: pgvector/pgvector:pg16
    container_name: mindmorph-db
    environment:
      POSTGRES_USER: mindmorph
      POSTGRES_PASSWORD: mindmorph
      POSTGRES_DB: mindmorph
    ports:
      - "5432:5432"
    volumes:
      - mindmorph_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindmorph"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: mindmorph-neo4j
    environment:
      NEO4J_AUTH: neo4j/mindmorph_neo4j
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - mindmorph_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p mindmorph_neo4j 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  mindmorph_pgdata:
  mindmorph_neo4j_data:
